# Render Blueprint: one free web service that serves both the API and the
# built React app. Render -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: trick-or-commit
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # every push to the default branch redeploys
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      # Admin login, created on first boot. Set these in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # SMEPay UPI checkout (used when set). SMEPAY_ENV: test | live.
      - key: SMEPAY_CLIENT_ID
        sync: false
      - key: SMEPAY_CLIENT_SECRET
        sync: false
      - key: SMEPAY_ENV
        value: test
      # Razorpay TEST keys (optional alternative). With no gateway keys, a demo gateway is used.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # MongoDB Atlas, shared with the Lantern Desk helpdesk ("Report a problem" tickets
      # land in its database; the helpdesk forwards them to AutoFix). In Atlas Network
      # Access, allow Render's outbound IPs (or 0.0.0.0/0 for the demo).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lantern_desk
