# Render Blueprint: one free web service that serves both the API and the
# built React app. Render -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: trick-or-commit
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true            # every push to the default branch redeploys
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      # Admin login, created on first boot. Set these in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Razorpay TEST keys; leave empty to use the built-in demo gateway.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
